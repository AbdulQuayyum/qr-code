<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal QR Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* Smooth transitions for a premium minimalist feel */
        .transition-all {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md bg-white rounded-2xl border border-gray-100 shadow-sm p-8 space-y-6">

        <header class="text-center space-y-1">
            <h1 class="text-xl font-medium tracking-tight text-gray-900">QR Generator</h1>
            <p class="text-xs text-gray-400">Clean, instant, and secure.</p>
        </header>

        <div class="flex justify-between border-b border-gray-100 pb-2 text-sm font-medium text-gray-400">
            <button onclick="switchTab('text')" id="tab-text"
                class="text-gray-900 border-b-2 border-gray-900 pb-2 px-1 transition-all">Text / URL</button>
            <button onclick="switchTab('wifi')" id="tab-wifi"
                class="hover:text-gray-600 pb-2 px-1 transition-all">Wi-Fi</button>
            <button onclick="switchTab('vcard')" id="tab-vcard"
                class="hover:text-gray-600 pb-2 px-1 transition-all">Contact</button>
        </div>

        <div id="input-container" class="space-y-4">
            <div id="fields-text" class="tab-content">
                <input type="text" id="input-url" placeholder="https://example.com or your text here"
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-gray-400 focus:bg-white transition-all">
            </div>

            <div id="fields-wifi" class="tab-content hidden space-y-3">
                <input type="text" id="wifi-ssid" placeholder="Network Name (SSID)"
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-gray-400 focus:bg-white transition-all">
                <input type="password" id="wifi-pass" placeholder="Password"
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-gray-400 focus:bg-white transition-all">
                <select id="wifi-type"
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-gray-400 focus:bg-white transition-all">
                    <option value="WPA">WPA/WPA2</option>
                    <option value="WEP">WEP</option>
                    <option value="nopass">Unsecured</option>
                </select>
            </div>

            <div id="fields-vcard" class="tab-content hidden space-y-3 max-h-[350px] overflow-y-auto pr-1">
                <input type="text" id="vcard-name" placeholder="Full Name *"
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-gray-400 focus:bg-white transition-all">

                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="vcard-title" placeholder="Job Title (e.g. Construction Director)"
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-gray-400 focus:bg-white transition-all">
                    <input type="text" id="vcard-org" placeholder="Company (e.g. Ariosh)"
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-gray-400 focus:bg-white transition-all">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <input type="tel" id="vcard-phone-mobile" placeholder="Mobile Phone"
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-gray-400 focus:bg-white transition-all">
                    <input type="tel" id="vcard-phone-work" placeholder="Work Phone"
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-gray-400 focus:bg-white transition-all">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <input type="email" id="vcard-email-primary" placeholder="Primary Email"
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-gray-400 focus:bg-white transition-all">
                    <input type="email" id="vcard-email-secondary" placeholder="Secondary/Info Email"
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-gray-400 focus:bg-white transition-all">
                </div>

                <input type="url" id="vcard-website" placeholder="Website (http://...)"
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-gray-400 focus:bg-white transition-all">

                <input type="text" id="vcard-address" placeholder="Address (e.g. Azuri Towers, Marina District)"
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-gray-400 focus:bg-white transition-all">

                <p class="text-[11px] text-gray-400 leading-snug pt-1">
                    Tip: fewer fields = a simpler, easier-to-scan code. Leave out anything that's not essential.
                </p>
            </div>
        </div>

        <button onclick="generateQR()"
            class="w-full bg-gray-950 text-white text-sm font-medium py-3 rounded-lg hover:bg-gray-800 transition-all shadow-sm">
            Generate Code
        </button>

        <div id="qr-container"
            class="hidden pt-4 flex flex-col items-center justify-center border-t border-gray-100 space-y-4">
            <div id="qrcode" class="p-3 bg-white border border-gray-100 rounded-xl shadow-sm"></div>
            <button onclick="downloadQR()"
                class="text-xs font-medium text-gray-500 hover:text-gray-900 transition-all flex items-center space-x-1">
                <span>Download PNG</span>
            </button>
        </div>

    </div>

    <script>
        let currentTab = 'text';
        let qrcodeElement = document.getElementById("qrcode");
        let qrGenerator = null;

        // Tab Switching Logic
        function switchTab(tabId) {
            currentTab = tabId;

            // Toggle visibility of input sections
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`fields-${tabId}`).classList.remove('hidden');

            // Reset and update tab button styles
            ['text', 'wifi', 'vcard'].forEach(id => {
                const btn = document.getElementById(`tab-${id}`);
                btn.className = "hover:text-gray-600 pb-2 px-1 transition-all";
            });
            const activeBtn = document.getElementById(`tab-${tabId}`);
            activeBtn.className = "text-gray-900 border-b-2 border-gray-900 pb-2 px-1 transition-all";

            // Hide previous QR code on tab switch to keep UI clean
            document.getElementById('qr-container').classList.add('hidden');
            qrcodeElement.innerHTML = "";
            qrGenerator = null;
        }

        // Process Inputs based on active tab
        function getQRData() {
            if (currentTab === 'text') {
                return document.getElementById('input-url').value.trim();
            }

            if (currentTab === 'wifi') {
                const ssid = document.getElementById('wifi-ssid').value.trim();
                const pass = document.getElementById('wifi-pass').value.trim();
                const type = document.getElementById('wifi-type').value;
                if (!ssid) return '';
                return `WIFI:S:${ssid};T:${type};P:${pass};;`;
            }

            if (currentTab === 'vcard') {
                const name = document.getElementById('vcard-name').value.trim();
                const title = document.getElementById('vcard-title').value.trim();
                const org = document.getElementById('vcard-org').value.trim();
                const mobile = document.getElementById('vcard-phone-mobile').value.trim();
                const work = document.getElementById('vcard-phone-work').value.trim();
                const emailPrimary = document.getElementById('vcard-email-primary').value.trim();
                const emailSecondary = document.getElementById('vcard-email-secondary').value.trim();
                const website = document.getElementById('vcard-website').value.trim();
                const address = document.getElementById('vcard-address').value.trim();

                if (!name) return '';

                // Build a structured, compact vCard 3.0 (short field tags keep payload
                // size down, which keeps the QR code's module count low)
                let vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nN:${name};;;;`;

                if (org) vcard += `\nORG:${org}`;
                if (title) vcard += `\nTITLE:${title}`;
                if (mobile) vcard += `\nTEL;TYPE=CELL:${mobile}`;
                if (work) vcard += `\nTEL;TYPE=WORK:${work}`;
                if (emailPrimary) vcard += `\nEMAIL;TYPE=PREF,INTERNET:${emailPrimary}`;
                if (emailSecondary) vcard += `\nEMAIL;TYPE=INTERNET:${emailSecondary}`;
                if (website) vcard += `\nURL:${website}`;
                if (address) vcard += `\nADR;TYPE=WORK:;;${address};;;;`;

                vcard += `\nEND:VCARD`;
                return vcard;
            }
            return '';
        }

        // Generate QR Code
        function generateQR() {
            const data = getQRData();

            if (!data) {
                alert('Please fill out the required fields.');
                return;
            }

            // Clear previous QR Code
            qrcodeElement.innerHTML = "";

            // Unhide container
            document.getElementById('qr-container').classList.remove('hidden');

            // Render larger (was 180x180) and with LOW error correction instead of
            // MEDIUM. Error correction adds redundant data that increases the module
            // count (the "density" you're seeing) — dropping to L keeps the code as
            // simple as the data allows, and the bigger canvas makes each module
            // physically larger so cameras can resolve it without zooming in.
            // If you print the card small, size this up further (e.g. 400) and scale
            // down in your layout software rather than shrinking a small PNG.
            qrGenerator = new QRCode(qrcodeElement, {
                text: data,
                width: 300,
                height: 300,
                colorDark: "#030712", // Gray 950
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.L
            });
        }

        // Download QR Code function
        function downloadQR() {
            const canvas = qrcodeElement.querySelector('canvas');
            const img = qrcodeElement.querySelector('img');

            const processDownload = (dataUrl) => {
                fetch(dataUrl)
                    .then(res => res.blob())
                    .then(blob => {
                        const blobUrl = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = blobUrl;
                        link.download = `qr-code-${currentTab}.png`;

                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);

                        setTimeout(() => URL.revokeObjectURL(blobUrl), 100);
                    })
                    .catch(err => console.error("Download failed:", err));
            };

            if (canvas) {
                processDownload(canvas.toDataURL("image/png"));
            } else if (img && img.src) {
                processDownload(img.src);
            }
        }
    </script>
</body>

</html>
